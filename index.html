<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf=8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Queue Game</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/panelleft.css">

    
  </head>
  <body>

    <div class="blob"></div>
    <div class="blob2"></div>

    <div class="Customer-Queue container-fluid py-4">

      <!--Header code-->
      <div class="header row mb-1">

        <div class="col-4">
          <div class="left-header">
            <div class="game-icon">
              <img src="assets/icons/coffee.svg">
            </div>
            <p>Customer Queue Game</p>
          </div>
        </div>

        <!--Middle side of the header-->
        <div class="col-4 text-center">
          <div class="middle-header">
            <div class="shift-label" >MORNING RUSH</div>
            <div class="goal-badge">SERVE 10</div>
          </div>
        </div>

        <!--Right side of the header-->
        <!--Reset button-->
        <div class="col-4 text-end">
          <div class="right-header">
            <button id="resetBtn" class="reset-btn">
              <img src="assets/icons/Arrow-Reload--Streamline-Sharp-Streamline-Material-Free.svg">
              Reset</button>
          </div>
        </div>

      </div>


      
      <div class="row g-4 game-area">

        <!--Left side of the game-->
        <div class="col-lg-3 ;">
          <div class="left-panel text-center">
            <p class="label">SHIFT PROGRESS</p>
  
            <div class="progress-circle">
              <span id="servedCount">0</span>of 10
            </div>
            <p id="goalText" class="goal-text mt-3">10 guests to go</p>
            <p class="goal-sub">First in, first served</p>

            <div class="borderline"></div>

  
            <p class="waiting-text">
              Waiting now: <span id="waitingCount" class="waiting-number">0</span>
            </p>
            <button id="addBtn" class="add-btn w-100"> + Add customer</button>
          </div>
        </div>
        

      </div>
    </div>

  <script src="assets/jquery-3.7.1.min.js"></script>
  <script src="js/game.js"></script>


  </body>
</html>

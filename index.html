<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf=8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Queue Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/CC-104-Project/css/header.css">
    <link rel="stylesheet" href="/CC-104-Project/css/general.css">
    <link rel="stylesheet" href="/CC-104-Project/css/panelleft.css">

    
  </head>
  <body>

    <div class="blob"></div>
    <div class="blob2"></div>

    <div class="Customer-Queue container-fluid py-4">

      <!--Header code-->
      <div class="header row mb-1">

        <div class="col-4">
          <div class="left-header">
            <div class="game-icon">
              <img src="/CC-104-Project/assets/icons/coffee.svg">
            </div>
            <p>Customer Queue Game</p>
          </div>
        </div>

        <!--Middle side of the header-->
        <div class="col-4 text-center">
          <div class="middle-header">
            <div class="shift-label" >MORNING RUSH</div>
            <div class="goal-badge">SERVE 10</div>
          </div>
        </div>

        <!--Right side of the header-->
        <!--Reset button-->
        <div class="col-4 text-end">
          <div class="right-header">
            <button id="resetBtn" class="reset-btn">
              <img src="/CC-104-Project/assets/icons/Arrow-Reload--Streamline-Sharp-Streamline-Material-Free.svg">
              Reset</button>
          </div>
        </div>

      </div>


      
      <div class="row g-4 game-area">

        <!--Left side of the game-->
        <div class="col-lg-3 ;">
          <div class="left-panel text-center">
            <p class="label">SHIFT PROGRESS</p>
  
            <div class="progress-circle">
              <span id="servedCount">0</span>of 10
            </div>
            <p class="goal-sub">First in, first served</p>

            <div class="borderline"></div>

            <p id="goalText" class="goal-text mt-3">10 guests to go</p>
  
            <p class="waiting-text">
              Waiting now: <span id="waitingCount" class="waiting-number">0</span>
            </p>
            <button id="addBtn" class="add-btn w-100"> + Add customer</button>
          </div>
        </div>
        

      </div>
    </div>



  </body>
</html>
